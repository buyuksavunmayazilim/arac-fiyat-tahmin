services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_APP: run.py
      PYTHONPATH: /home/arac
    ports:
      - "5005:5000"
    volumes:
      - ml_models:/home/arac/ml/models
    command: gunicorn -w 4 -b 0.0.0.0:5000 --timeout 120 run:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: registry.sisasoft.com.tr/buyuk-tahmin/arac-fiyat-tahmin-worker:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_APP: run.py
      PYTHONPATH: /home/arac
    volumes:
      - ml_models:/home/arac/ml/models
    command: celery -A celery_worker.celery worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker.celery inspect ping -d celery@$$(hostname) | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  trainer:
    image: registry.sisasoft.com.tr/buyuk-tahmin/arac-fiyat-tahmin-trainer:latest
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_APP: run.py
      PYTHONPATH: /home/arac
    volumes:
      - ml_models:/home/arac/ml/models
    command: python ml/train.py

  filo_importer:
    image: registry.sisasoft.com.tr/buyuk-tahmin/arac-fiyat-tahmin-filo-importer:latest
    restart: "no"
    env_file:
      - .env
    environment:
      FILO_FILE: /data/Filo Takip Listesi-13-05-2026 1.xlsx
      HASAR_FILE: /data/Hasar Listesi 13-05-2026.xlsx
      SOURCE_DATE: "2026-05-13"
      RECREATE_TABLE_ON_IMPORT: "true"
      SCHEMA_FILE: /sql/01_create_filo_arac_master.sql
      PYTHONPATH: /app
    volumes:
      - ./filo_importer/data:/data
      - ./filo_importer/sql:/sql
    command: python import_filo_arac_master.py

volumes:
  ml_models: