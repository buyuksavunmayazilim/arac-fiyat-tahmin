<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Araç Fiyat Tahmin{% endblock %} — BSY Techs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <span class="brand-badge">BSY</span>
      <span class="brand-text">Araç <em>Analiz</em></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menü" type="button">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/" class="nav-link {% if request.endpoint == 'views.index' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 10l7-7 7 7M5 8v8h4v-4h2v4h4V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Tahmin
      </a></li>
      <li><a href="/bfl" class="nav-link {% if request.endpoint == 'views.bfl' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 13l2-5h10l2 5M5 13h10v3H5zM6 16v1M14 16v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="13" r="0.5" fill="currentColor"/><circle cx="13" cy="13" r="0.5" fill="currentColor"/></svg>
        BFL Tahmin
      </a></li>
      <li><a href="/analytics" class="nav-link {% if request.endpoint == 'views.analytics' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="none"><path d="M2 16l4-6 4 3 4-8 4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Analitik
      </a></li>
      <li><a href="/history" class="nav-link {% if request.endpoint == 'views.history' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Geçmiş
      </a></li>
      <li><a href="/config" class="nav-link {% if request.endpoint == 'views.config' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 3a1 1 0 01.9.6l.7 1.6 1.7.2a1 1 0 01.6 1.7l-1.2 1.2.3 1.7a1 1 0 01-1.5 1l-1.5-.8-1.5.8a1 1 0 01-1.5-1l.3-1.7-1.2-1.2a1 1 0 01.6-1.7l1.7-.2.7-1.6A1 1 0 0110 3z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        Config
      </a></li>
    </ul>
    <a href="https://bsytechs.com" target="_blank" class="nav-ext">
      bsytechs.com
      <svg viewBox="0 0 16 16" fill="none"><path d="M6 4H4a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1v-2M9 3h4m0 0v4m0-4L7 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</nav>

<!-- ── Page ───────────────────────────────────────────────────────────────── -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- ── Footer ─────────────────────────────────────────────────────────────── -->
<footer class="footer">
  <div class="footer-inner">
    <span>© 2026 Büyük Savunma Yazılım A.Ş.</span>
    <span class="footer-sep">·</span>
    <span>Yapay Zeka Destekli Fiyat Analizi</span>
    <span class="footer-sep">·</span>
    <a href="https://bsytechs.com" target="_blank">bsytechs.com</a>
  </div>
</footer>

<script>
  (function() {
    var t = document.getElementById('navToggle');
    var l = document.getElementById('navLinks');
    if (t && l) {
      t.addEventListener('click', function() { l.classList.toggle('open'); });
    }
  })();
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
